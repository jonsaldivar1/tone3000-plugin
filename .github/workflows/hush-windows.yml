# Hush (DI de-noiser plugin, hush/): Windows build.
#
# - push to main touching hush/ or shared/ -> build
# - manual run                                                   -> build
#
# Output: the installer as a run artifact, and on the rolling pre-release
# "hush-latest" (Releases page) for a one-click download.

name: Hush Windows build

on:
  push:
    branches: [main]
    paths:
      - "hush/**"
      - "shared/**"
      - ".github/workflows/hush-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hush-windows
  cancel-in-progress: false

jobs:
  windows:
    name: Build Hush (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read version
        shell: bash
        run: echo "HUSH_VERSION=$(tr -d '[:space:]' < hush/VERSION)" >> "$GITHUB_ENV"

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: libs/juce
          key: hush-juce-9.0.3-windows

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Steinberg's ASIO SDK (headers only) for the standalone's ASIO driver.
      - name: Download ASIO SDK
        shell: pwsh
        run: |
          curl.exe -sSL -o asiosdk.zip https://www.steinberg.net/asiosdk
          Expand-Archive asiosdk.zip -DestinationPath "$env:RUNNER_TEMP\asiosdk"
          $sdk = (Get-ChildItem "$env:RUNNER_TEMP\asiosdk" -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$sdk\common\iasiodrv.h")) {
            Write-Error "ASIO SDK layout unexpected: iasiodrv.h not found under $sdk"
            exit 1
          }
          $sdk = $sdk -replace '\\', '/'
          "ASIO_SDK_PATH=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        shell: bash
        run: |
          cmake -B build-hush -S hush -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHUSH_TESTS=ON \
            -DASIO_SDK_PATH="$ASIO_SDK_PATH"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-hush --config Release --parallel 2>&1 | tee build-hush.log

      # Compiler errors as annotations, so they show on the run page (and
      # through the checks API) without opening the raw log.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error [A-Z]+[0-9]+|: error|fatal error|LNK[0-9]+" build-hush.log | head -25 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Run tests
        shell: bash
        run: ./build-hush/HushTests_artefacts/Release/HushTests.exe

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DVersion=$env:HUSH_VERSION `
            /DArtefactsDir="$env:GITHUB_WORKSPACE\build-hush\Hush_artefacts\Release" `
            /DOutputDir="$env:GITHUB_WORKSPACE\build-hush" `
            hush\installer\hush.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hush-v${{ env.HUSH_VERSION }}-windows-x64
          path: build-hush/Hush-v*-windows-x64.exe
          if-no-files-found: error

      - name: Publish hush-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe=$(ls build-hush/Hush-v*-windows-x64.exe)
          # The release page doubles as the install guide for anyone you send
          # the link to; the guide rides along as downloads too.
          sed -e "s/{{VERSION}}/${HUSH_VERSION}/g" -e "s/{{COMMIT}}/$(git rev-parse --short HEAD)/g" \
            hush/installer/release-notes.md > release-notes.md
          gh release delete hush-latest --cleanup-tag -y || true
          gh release create hush-latest "$exe" hush/manual/Hush-Guide.pdf \
            --prerelease \
            --target "$(git rev-parse HEAD)" \
            --title "Hush v${HUSH_VERSION}" \
            --notes-file release-notes.md
