# dJONt (low-end toolkit plugin, djont/): Windows build.
#
# - push to main touching djont/ (or the shared pitch shifter) -> build
# - manual run                                                   -> build
#
# Output: the installer as a run artifact, and on the rolling pre-release
# "djont-latest" (Releases page) for a one-click download.

name: dJONt Windows build

on:
  push:
    branches: [main]
    paths:
      - "djont/**"
      - "plugin/src/PitchShift.cpp"
      - "plugin/include/PitchShift.h"
      - ".github/workflows/djont-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: djont-windows
  cancel-in-progress: false

jobs:
  windows:
    name: Build dJONt (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read version
        shell: bash
        run: echo "DJONT_VERSION=$(tr -d '[:space:]' < djont/VERSION)" >> "$GITHUB_ENV"

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: libs/juce
          key: djont-juce-9.0.3-windows

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Steinberg's ASIO SDK (headers only) for the standalone's ASIO driver.
      - name: Download ASIO SDK
        shell: pwsh
        run: |
          curl.exe -sSL -o asiosdk.zip https://www.steinberg.net/asiosdk
          Expand-Archive asiosdk.zip -DestinationPath "$env:RUNNER_TEMP\asiosdk"
          $sdk = (Get-ChildItem "$env:RUNNER_TEMP\asiosdk" -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$sdk\common\iasiodrv.h")) {
            Write-Error "ASIO SDK layout unexpected: iasiodrv.h not found under $sdk"
            exit 1
          }
          $sdk = $sdk -replace '\\', '/'
          "ASIO_SDK_PATH=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        shell: bash
        run: |
          cmake -B build-djont -S djont -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDJONT_TESTS=ON \
            -DASIO_SDK_PATH="$ASIO_SDK_PATH"

      - name: Build
        run: cmake --build build-djont --config Release --parallel

      - name: Run tests
        shell: bash
        run: ./build-djont/DjontTests_artefacts/Release/DjontTests.exe

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DVersion=$env:DJONT_VERSION `
            /DArtefactsDir="$env:GITHUB_WORKSPACE\build-djont\dJONt_artefacts\Release" `
            /DOutputDir="$env:GITHUB_WORKSPACE\build-djont" `
            djont\installer\djont.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: dJONt-v${{ env.DJONT_VERSION }}-windows-x64
          path: build-djont/dJONt-v*-windows-x64.exe
          if-no-files-found: error

      - name: Publish djont-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe=$(ls build-djont/dJONt-v*-windows-x64.exe)
          gh release delete djont-latest --cleanup-tag -y || true
          gh release create djont-latest "$exe" \
            --prerelease \
            --target "$(git rev-parse HEAD)" \
            --title "dJONt latest (v${DJONT_VERSION}, $(git rev-parse --short HEAD))" \
            --notes "Built from main at $(git rev-parse --short HEAD). Unsigned personal build: Windows SmartScreen will warn on first run (More info > Run anyway)."
